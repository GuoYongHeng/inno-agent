<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户菜单</title>
    <link rel="stylesheet" href="./user-panel.css" />
  </head>
  <body>
    <div class="panel">
      <button
        id="user-button"
        class="user-button"
        type="button"
        title="用户菜单"
        aria-expanded="false"
      >
        <span id="avatar" class="avatar" aria-hidden="true">U</span>
        <span id="display-name" class="display-name">用户</span>
      </button>

      <div id="menu" class="menu" hidden>
        <div class="menu-items">
          <button class="menu-item" type="button" data-action="account">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
            账号管理
          </button>

          <button class="menu-item" type="button" data-action="official-site">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m22 10-10-5L2 10l10 5 10-5Z" />
              <path d="M6 12.5V16c0 1.7 2.7 3 6 3s6-1.3 6-3v-3.5" />
              <path d="M22 10v6" />
            </svg>
            InnoAgent
          </button>

          <button class="menu-item menu-item-with-arrow" type="button" data-action="about">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
            关于启创
            <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>

        <div class="menu-divider"></div>

        <button id="logout-button" class="menu-item danger" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <path d="m16 17 5-5-5-5" />
            <path d="M21 12H9" />
          </svg>
          退出登录
        </button>
      </div>

      <div id="about-menu" class="about-menu" hidden>
        <button class="about-item" type="button">联系我们</button>
        <button class="about-item" type="button">用户协议</button>
        <button class="about-item" type="button">隐私政策</button>
        <button class="about-item" type="button">侵权投诉</button>
        <div class="about-divider"></div>
        <div class="about-records">
          <div>沪ICP备2021037901号-1</div>
          <div class="about-divider"></div>
          <div>Shanghai-QiChuangInnoSpark-202601200116</div>
        </div>
      </div>
    </div>
    <script src="./user-panel.js"></script>
  </body>
</html>
